<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6b3a">
  <title>ESG Campo</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/app.css">
  <style>
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
    .choice { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
    .choice:hover { border-color: var(--primary); }
    .choice b { font-size: 1.15rem; color: var(--primary); }
  </style>
</head>
<body style="padding-bottom:0">
  <header class="topbar"><span class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> ESG Campo</span></header>
  <main class="container">
    <h1>Diagnóstico ESG em propriedades rurais</h1>
    <p class="muted">Escolha o aplicativo:</p>
    <div class="choices">
      <a class="card choice" href="campo/">
        <b>App do orientador →</b>
        <span>Coleta em campo, funciona sem internet. Instale na tela inicial do celular ou tablet.</span>
      </a>
      <a class="card choice" href="admin/">
        <b>Painel administrativo →</b>
        <span>Questionários, acompanhamento das visitas, dashboard e cadastro de orientadores.</span>
      </a>
    </div>
  </main>
</body>
</html>
